<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Apps</title>
    <link rel="stylesheet" href="/css/font-awesome.css">
    <script src="/js/moment.min.js"></script>
    <script src="/js/lodash.min.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f5f7fa;
      }

      html.dark body {
        background: #141414;
      }

      #boot-placeholder {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
        font-size: 64px;
        letter-spacing: 1px;
        color: #3574f0;
        opacity: 0.55;
      }
    </style>
    <script>
      // 首屏应用主题，避免亮色闪烁；后续由 src/composables/useTheme.js 接管
      (function () {
        try {
          var mode = localStorage.getItem('wr:theme')
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <script>
      (function () {
        function showBootError(message) {
          var node = document.getElementById('boot-placeholder')
          if (!node) return
          node.textContent = '启动失败：' + String(message || '未知错误')
          node.style.fontSize = '18px'
          node.style.fontFamily = 'system-ui, sans-serif'
          node.style.whiteSpace = 'pre-wrap'
          node.style.padding = '24px'
          node.style.opacity = '0.9'
        }
        window.addEventListener('error', function (event) {
          showBootError(event.message || (event.error && event.error.message))
        }, true)
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          showBootError(reason && (reason.stack || reason.message) || reason)
        })
      })()
    </script>
    <div id="boot-placeholder" aria-hidden="true">loading</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

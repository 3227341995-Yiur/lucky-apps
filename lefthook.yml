# Git hooks (lefthook)。安装：pnpm exec lefthook install（install 时自动执行）。
pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,vue}'
      run: pnpm exec oxlint --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: whitespace (staged)
      run: git diff --cached --check

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: test
      run: pnpm test

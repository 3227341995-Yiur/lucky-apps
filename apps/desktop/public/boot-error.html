<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Apps · 启动失败</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(circle at 80% 0%, #1e3a8a 0%, #0f172a 55%, #020617 100%);
      color: #e2e8f0;
    }
    .card {
      width: min(560px, 100%);
      padding: 34px 36px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #67e8f9;
    }
    h1 { margin: 10px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 13px; line-height: 1.7; color: #94a3b8; }
    .detail {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.16);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: #fff; }
    .primary:hover { background: #3b82f6; }
    .ghost { border-color: rgba(148, 163, 184, 0.28); color: #cbd5e1; background: transparent; }
    .ghost:hover { background: rgba(148, 163, 184, 0.1); }
    .hint { margin-top: 16px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">LUCKY APPS · BOOT</div>
    <h1>Node.js 服务未能启动</h1>
    <p>
      Lucky Apps 需要 Node.js 24 或更高版本。请安装或升级 Node.js 后重新打开应用。
    </p>
    <div class="detail" id="detail">正在读取错误信息…</div>
    <div class="actions">
      <a class="primary" href="https://nodejs.org/zh-CN/download" target="_blank" rel="noopener">下载 Node.js</a>
      <button class="ghost" onclick="location.reload()">重试</button>
    </div>
    <div class="hint">安装完成后如果仍然失败，请确认终端里 <code>node -v</code> 能正常输出版本号。</div>
  </main>
  <script>
    function showError() {
      const detail = document.getElementById('detail')
      if (!detail) return
      detail.textContent = window.__BOOT_ERROR__ || '未检测到可用的 Node.js 服务。'
    }
    window.addEventListener('lucky-boot-error', showError)
    window.addEventListener('DOMContentLoaded', showError)
  </script>
</body>
</html>
